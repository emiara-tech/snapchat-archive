name: CodeRabbit approval

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  pull-requests: read

concurrency:
  group: coderabbit-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approval:
    name: CodeRabbit approval
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require CodeRabbit approval for the current commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const headSha = pullRequest.head.sha;
            const params = { ...context.repo, pull_number: pullRequest.number };
            const decisions = new Set(['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED']);

            for (let attempt = 0; attempt < 20; attempt++) {
              const { data: current } = await github.rest.pulls.get(params);
              if (current.state !== 'open' || current.head.sha !== headSha) {
                core.setFailed('This run no longer represents an open pull request at its current head.');
                return;
              }

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                ...params,
                per_page: 100,
              });
              const decision = reviews
                .filter(review => review.user?.login === 'coderabbitai[bot]'
                  && review.user.type === 'Bot' && decisions.has(review.state))
                .sort((left, right) => right.id - left.id)[0];

              if (decision?.state === 'APPROVED' && decision.commit_id === headSha) {
                core.notice(`CodeRabbit approved ${headSha} in review ${decision.id}.`);
                return;
              }

              core.info('Waiting for CodeRabbit to approve the current commit.');
              if (attempt < 19) await new Promise(resolve => setTimeout(resolve, 30_000));
            }

            core.setFailed('CodeRabbit has not approved the current commit. Address its feedback and wait for a new review.');
